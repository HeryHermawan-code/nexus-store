let LANG="id";
function setLang(l){LANG=l;document.getElementById('title').innerText=T[l].title;document.getElementById('vaultTitle').innerText=T[l].vaultTitle;document.getElementById('catalogTitle').innerText=T[l].catalogTitle;document.getElementById('vaultStatus').innerText=T[l].vaultStatus;document.getElementById('rateInfo').innerText=T[l].rate;render();}

function formatPrice(idr){
let cur=document.getElementById('curr').value;
let rate=RATES[cur];
if(cur==="IDR"){return `<div class="price-main">Rp ${idr.toLocaleString('id-ID')}</div><div class="price-sub">≈ $${(idr/16500).toFixed(2)} USD</div>`}
else{
let converted=idr/rate;
let display=cur==="JPY"?`¥${Math.round(converted).toLocaleString('id-ID')}`:cur==="USD"?`$${converted.toLocaleString('en-US',{minimumFractionDigits:2})}`:cur==="EUR"?`€${converted.toLocaleString('en-US',{minimumFractionDigits:2})}`:`${cur} ${converted.toFixed(2)}`;
return `<div class="price-main">${display}</div><div class="price-sub">≈ Rp ${idr.toLocaleString('id-ID')} IDR</div>`
}
}

function render(){
let html='';PRODUCTS.forEach(p=>{
let name=p.name[LANG]||p.name.id;
let desc=p.desc[LANG]||p.desc.id;
html+=`<div class="product-item"><div style="flex:1"><b>${name}</b><br><span style="font-size:12px;color:#94a3b8">${desc}</span><br>${formatPrice(p.priceIDR)}</div><button onclick="buy('${p.id}',${p.priceIDR})">${T[LANG].buy}</button></div>`;
});
document.getElementById('catalog').innerHTML=html;
}

function buy(id,price){
let cur=document.getElementById('curr').value;
alert(`${T[LANG].buy} : ${id}\nTotal: ${cur} -> Rp ${price.toLocaleString('id-ID')} \n\nDirect Settlement ke:\nBRI 015901054376505\nAn HERY HERMAWAN\n\nPremium Real Goal 100% - Auto IDR Convert`);
