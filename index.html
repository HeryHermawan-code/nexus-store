<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #f8fafc; text-align: center; }
        .vault-info { background: #0f172a; border-left: 4px solid #38bdf8; padding: 12px; font-family: monospace; font-size: 14px; margin-bottom: 15px; }
        .product-item { border-bottom: 1px solid #334155; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .product-item:last-child { border-bottom: none; }
        button { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }

    </style>
</head>
<body>
    <div class="container">
        <h1>NEXUS STOREFRONT</h1>

    <script>
        // Masukkan URL tunnel publik Termux Anda jika sudah aktif (contoh: Pinggy / Cloudflare)
        
        const BACKEND_URL = "https://4623ca8925b6fdee-110-137-92-148.serveousercontent.com";



        async function fetchProducts() {
            try {
                let response = await fetch(`${BACKEND_URL}/store`);
                let data = await response.json();
                let html = '';
                data.store.forEach(p => {
                    html += `
                        <div class="product-item">
                            <div>
                                <b>${p.product_name}</b><br>
                                <span class="price">Rp ${p.price.toLocaleString('id-ID')}</span>
                            </div>
                            <button onclick="buyProduct(${p.id})">Beli</button>
                        </div>
                    `;
                });
                document.getElementById('catalog').innerHTML = html;
            } catch (e) {
                document.getElementById('catalog').innerHTML = '<p style="color: #f87171;">Menggunakan antarmuka offline. Sambungkan tunnel untuk sinkronisasi otomatis.</p>';
            }
        }
