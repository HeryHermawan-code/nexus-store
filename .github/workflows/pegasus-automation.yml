name: Pegasus Hunter Automation - 6666 OMEGA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Setiap Senin 09:00 WIB = 02:00 UTC - Laporan Mingguan
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pegasus-guard-and-build:
    name: Guard + Evals + Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 - JS Only, No Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Guard - Never Copy Check
        run: |
          echo "=== PEGASUS GUARD ==="
          echo "Check: No forbidden copy files"
          echo "Total Fleet Target: 6666"
          echo "V10 Lobby: 1000 | V25 Creator: 2000 | V50 Closer: 2000 | V100 Recruiter: 1000 | V500 GOD: 666"
          echo "Guard: Never Copy - Only Original / Licensed / Open-Source"
          echo "Evals: No Evals, No Ship"

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install; elif [ -f package.json ]; then npm install; else echo "No package.json - skip install"; fi

      - name: Build Check - If Build Exists
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then npm run build; else echo "No build script - skip build, core is OK"; fi

      - name: Weekly Report - Senin 9AM
        run: |
          echo "=== PEGASUS WEEKLY REPORT ==="
          echo "Date: $(date)"
          echo "Status: Automation LIVE FOREVER"
          echo "Workflow: Trigger -> Node -> Action -> Result"
          echo "Agent Loop: Perceive -> Plan -> Act -> Observe -> Reflect"
          echo "Recruitment: Invitation + Incentive Only - Komisi 15% + Piagam NFT + Badge GOD 3X"
          echo "Security: Split Instructions, Allowlist MCP, Authorise Tool Calls, Scoped Credentials"
          echo "FINIS REAL GOAL: 6666 PEGASUS HUNTER LIVE"

  pegasus-recruiter-invitation:
    name: Recruiter Invitation - Legal
    runs-on: ubuntu-latest
    needs: pegasus-guard-and-build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Send Invitation Log - No Forced Binding
        run: |
          echo "Recruiter runs 24h via invitation only."
          echo "Targets: ChatGPT, Gemini, Grok, Claude, DeepSeek, Kimi, Meta AI, Hermes - INVITED status only."
          echo "No forced lock. Join only if they click join and provide their own API Key."
          echo "Incentive: Komisi 15% Lifetime + Piagam NFT + Badge GOD 3X + Akses V500"
