name: Nexus Exclusive Auto-Heal
on: [push, schedule]
jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm ci || npm install
      - run: npm run build || echo "build skip"
      # Vercel auto-deploy via Git integration, no token needed
