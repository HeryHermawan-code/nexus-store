name: 6666-V6-Factory
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Token+Product Factory
        run: |
          mkdir -p data
          T=$(date +%s)
          R=$(openssl rand -hex 4)
          NAME="NEXUS V$((60+RANDOM%40)) $(shuf -e A2Z Z2A QUANTUM OMEGA MEGA ULTRA -n 1) AUTO"
          PRICE=$((35000+RANDOM%150000))
          echo "{\"id\":\"$T\",\"token\":\"NEXUS-TOKEN-$T-$R\",\"name\":\"$NAME\",\"price\":$PRICE,\"created\":\"$(date -u)\"}" >> data/produk.jsonl
          echo "{\"token\":\"NEXUS-TOKEN-$T-$R\",\"valid\":true,\"time\":\"$(date -u)\"}" >> data/token.jsonl
          echo "Produced token $R"
      - name: Push Factory
        run: |
          git config user.name "6666-V6"
          git config user.email "v6@nexus.bot"
          git add data/
          git commit -m "V6 factory token $(date)" || true
          git push origin main || true
