name: 6666-Product-Factory-V5
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Trending Product
        run: |
          mkdir -p data
          H=$(date +%H)
          NAMES=("A2Z AUTOMATION" "Z2A OMEGA" "NEXUS ULTRA" "QUANTUM TERMUX" "AUTO PROFIT" "DIRECT BANK SYSTEM")
          NAME=${NAMES[$((RANDOM % 6))]}
          V=$((60 + RANDOM % 40))
          PRICE=$((35000 + RANDOM % 200000))
          JSON="{\"id\":\"$(date +%Y%m%d%H%M)\",\"name\":\"$NAME V$V AUTO FACTORY\",\"price\":$PRICE,\"hour\":\"$H\",\"trend\":\"worldwide\",\"created\":\"$(date -u --iso-8601=seconds)\"}"
          echo "$JSON" >> data/produk.jsonl
          echo "Factory produced: $JSON"
      - name: Push
        run: |
          git config user.name "6666-Factory-V5"
          git config user.email "factory@nexus.bot"
          git add data/produk.jsonl
          git commit -m "V5 Factory $(date)" || true
          git push origin main || true
